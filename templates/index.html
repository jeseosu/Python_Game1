<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if preload %}Я — {{ meme.name }}! Який ти мем?{% else %}Тест: Який ти мем?{% endif %}</title>
    <meta property="og:title" content="{% if preload %}Я — {{ meme.name }}. А ти який мем?{% else %}Який ти мем?{% endif %}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@800;900&display=swap" rel="stylesheet">
    <!--стилі-->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <div class="card" id="card">
        <!--екран завантаження-->
        <div id="loading-screen">
            <div class="spinner">🧠</div>
            <p class="subtitle" id="loading-text">Завантажуємо…</p>
        </div>

        <!--екран старт-->
        <div id="start-screen" class="hidden">
            <h1 id="start-title">Який ти мем?</h1>
            <p class="subtitle" id="start-description">Пройди тест та дізнайся, який мем відповідає твоєму настрою!</p>
            <p class="emoji-wall" aria-hidden="true">🤷 🪵 🦈 ☕ 😎 🚽 🗿 🐶</p>
            <button class="btn" onclick="startQuiz()">Почати тест</button>
            <p class="subtitle small" id="start-stat"></p>
        </div>

        <!--екран питань -->
        <div id="quiz-screen" class="hidden">
            <div class="track"><div class="track-fill" id="track-fill"></div></div>
            <div class="progress-bar" id="progress-label">Питання 1 з 8</div>
            <h1 id="question-text">Текст питання...</h1>
            <div id="options-container"></div>
        </div>

        <!-- екран результату -->
        <div id="result-screen" class="hidden">
            <h1>Твій мем: <span id="result-title">...</span></h1>
            <div class="image-wrapper" id="image-wrapper">
                <img id="result-image" class="meme-img hidden" src="" alt="Результат">
                <span id="result-emoji" class="result-emoji"></span>
            </div>
            <p class="match" id="result-match"></p>
            <p class="tagline" id="result-tagline"></p>
            <p class="subtitle" id="result-description">...</p>
            <p class="rarity" id="result-rarity"></p>

            <div class="block" id="traits-block"><h2>Твій профіль</h2><div id="traits"></div></div>
            <div class="block" id="ranking-block"><h2>Ще збігається з</h2><div id="ranking"></div></div>

            <button class="btn" id="share-btn" onclick="shareResult()">Скопіювати посилання</button>
            <button class="btn btn-secondary" onclick="restartQuiz()">Пройти знову 🔄</button>
        </div>

        <!-- екран помилки -->
        <div id="error-screen" class="hidden">
            <h1>Щось пішло не так</h1>
            <p class="subtitle" id="error-text">Сервер не відповів.</p>
            <button class="btn" onclick="location.assign('/')">Спробувати знову</button>
        </div>
    </div>

    <script>window.PRELOAD = {{ preload|tojson }};</script>
    <!--підключаємо JavaScript -->
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
